spring:
  application:
    name: personal-finance-manager
  datasource:
    url: jdbc:h2:mem:financedb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false # disabled for performance
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
  cache:
    cache-names: categories,reports,goals,userSessions
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60m

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8081
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024
  servlet:
    session:
      cookie:
        http-only: true
        secure: false # Set to true in production with HTTPS
        name: FMSESSIONID

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: ERROR # reduced for performance
    org.hibernate.type.descriptor.sql.BasicBinder: ERROR
