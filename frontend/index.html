<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financial Manager Pro</title>
  <link rel="stylesheet" href="./style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  
  <div id="app-container">
    <!-- Login/Register View -->
    <div id="auth-view" class="view glass-panel active">
      <h1 class="glow-text">Finance Pro</h1>
      <p class="subtitle">Master your wealth today.</p>
      
      <div class="tabs">
        <button id="tab-login" class="active">Login</button>
        <button id="tab-register">Register</button>
      </div>

      <form id="auth-form">
        <div id="register-fields" style="display: none;">
          <div class="input-group">
            <input type="text" id="reg-fullName" placeholder="Full Name" />
          </div>
          <div class="input-group">
            <input type="text" id="reg-phone" placeholder="Phone Number" />
          </div>
        </div>
        <div class="input-group">
          <input type="text" id="auth-username" placeholder="Username" required />
        </div>
        <div class="input-group">
          <input type="password" id="auth-password" placeholder="Password" required />
        </div>
        <button type="submit" class="btn-primary" id="auth-submit">Login</button>
      </form>
      <div id="auth-error" class="error-msg"></div>
    </div>

    <!-- Main Dashboard View -->
    <div id="dashboard-view" class="view glass-panel" style="display: none;">
      <header class="dash-header">
        <h2 class="glow-text">Dashboard</h2>
        <button id="btn-logout" class="btn-outline">Logout</button>
      </header>
      
      <div class="stats-grid">
        <div class="stat-card">
          <h3>Total Balance</h3>
          <p id="total-balance">$0.00</p>
        </div>
        <div class="stat-card">
          <h3>Monthly Income</h3>
          <p id="monthly-income" class="positive">+$0.00</p>
        </div>
        <div class="stat-card">
          <h3>Monthly Expenses</h3>
          <p id="monthly-expense" class="negative">-$0.00</p>
        </div>
      </div>

      <div class="content-split">
        <div class="transactions-panel">
          <h3>Recent Transactions</h3>
          <ul id="transaction-list" class="transaction-list">
            <li class="loading">Loading...</li>
          </ul>
        </div>
        <div class="actions-panel">
          <h3>Add Transaction</h3>
          <form id="tx-form">
            <input type="number" id="tx-amount" placeholder="Amount" step="0.01" required>
            <input type="date" id="tx-date" required>
            <select id="tx-category" required>
              <option value="" disabled selected>Category</option>
            </select>
            <input type="text" id="tx-desc" placeholder="Description (Optional)">
            <button type="submit" class="btn-primary">Add</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
